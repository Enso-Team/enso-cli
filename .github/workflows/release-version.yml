name: Release version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-version

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Conventional commits on main decide the next version. release-please keeps a
      # release PR open with the bump and changelog. Merging it tags and publishes.
      # The org keeps GITHUB_TOKEN from opening PRs, so a fine-grained PAT with
      # contents and pull-requests write does it. Its pushes also fire CI on the PR.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # npm trusts this workflow as the package's publisher and mints a
      # per-run credential from the job's OIDC token. No secret, nothing expires.
      # Node 24 bundles an npm that speaks it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # main's package.json names the version the last release PR set, so it is
      # either on npm or owed to it. Asking the registry, not release-please, makes
      # a failed publish retryable by the next push to main or a dispatch.
      - name: Ask npm whether this version is owed
        id: owed
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION is on npm"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.owed.outputs.version
        run: npm ci
      - name: Publish to npm
        if: steps.owed.outputs.version
        run: npm publish --access public
