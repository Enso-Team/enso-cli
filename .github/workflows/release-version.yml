name: Release version

on:
  push:
    branches: [main, staging]

permissions:
  actions: write
  contents: write

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Staging carries the next package version into its release PR. Main tags that version.
      - name: Prepare or tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is already tagged"
              exit 0
            fi
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "Tagged v$VERSION"
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is waiting in the staging release PR"
            exit 0
          fi

          if git diff --quiet "v$VERSION"..HEAD -- src skills package.json; then
            echo "Nothing shippable since v$VERSION"
            exit 0
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          while true; do
            PATCH=$((PATCH + 1))
            NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            if ! git rev-parse -q --verify "refs/tags/v$NEXT_VERSION" >/dev/null; then
              break
            fi
          done

          npm version "$NEXT_VERSION" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore(release): v$NEXT_VERSION"
          git push origin HEAD:staging

          # A GITHUB_TOKEN push does not emit another workflow event. Dispatch CI so the
          # staging release PR receives the required test check on its new head commit.
          gh workflow run ci.yml --ref staging
