name: Release version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-version

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Conventional commits on main decide the next version. release-please keeps a
      # release PR open with the bump and changelog. Merging it tags and publishes.
      # The org keeps GITHUB_TOKEN from opening PRs, so a fine-grained PAT with
      # contents and pull-requests write does it. Its pushes also fire CI on the PR.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created
      - uses: actions/setup-node@v4
        if: steps.release.outputs.release_created
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # npm trusts this workflow as the package's publisher and mints a
      # per-run credential from the job's OIDC token. No secret, nothing expires.
      - name: Use an npm that speaks trusted publishing
        if: steps.release.outputs.release_created
        run: npm install -g npm@latest
      - name: Install dependencies
        if: steps.release.outputs.release_created
        run: npm ci
      - name: Publish to npm
        if: steps.release.outputs.release_created
        run: npm publish --access public
