version: 2
updates:
  # The actions are pinned to commit SHAs, so this is what moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Runtime dependencies, grouped so one PR a week carries the lot.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
