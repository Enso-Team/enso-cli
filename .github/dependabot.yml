version: 2
updates:
  # The actions are pinned to commit SHAs, so this is what moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  # npm dependencies. Minor and patch updates share one weekly PR.
  # Each major update gets its own PR so a breaking change is reviewed alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
